name: Release

# Builds a DMG and attaches it to a GitHub Release whenever a version tag
# (e.g. v0.1.0) is pushed. Can also be run manually to produce a test DMG
# without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with (e.g. 0.1.0)."
        required: false

permissions:
  contents: write

jobs:
  build:
    # macOS 26 image: Nook targets macOS 26, so it needs Xcode 26's SDK.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          [ -z "$VERSION" ] && VERSION="0.0.0-dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Nook $VERSION"

      # Enrolment made Developer ID signing possible; before it, ad-hoc was the
      # only option a personal team had. Both paths stay: the signed one runs when
      # the certificate and notary key are present, and the old one when they are
      # not, so adding the secrets is what switches this over rather than merging
      # this change.
      - name: Decide signing mode
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          if [ -n "${CERT:-}" ] && [ -n "${NOTARY:-}" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Never on a tag. Sparkle refuses an update that is signed less well
            # than what is installed, so once someone is running a Developer ID
            # build, an ad-hoc release is one they can never install — and the
            # failure would appear on their machine, not here. A missing secret is
            # a broken release, so it stops now.
            echo "::error::Signing secrets are missing. A tag release must be signed"
            echo "::error::and notarized, or installed copies will refuse the update."
            echo "::error::Set them with: make macos-signing-secrets"
            exit 1
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building ad-hoc. Downloads will warn."
            echo "Allowed here because this is a manual run, not a release."
          fi

      # A throwaway keychain rather than the runner's login one: it is unlocked
      # with a known password for this job only and dies with the runner.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask for permission and the job hangs
          # until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive app (Developer ID, hardened runtime)
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          xcodebuild archive \
            -skipPackagePluginValidation \
            -project Nook.xcodeproj \
            -scheme Nook \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Nook.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="F7WUT95TT6" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES

      # Xcode signs the app and the frameworks it embeds, but not bundles nested
      # inside a framework. Sparkle arrives from SwiftPM as a prebuilt binary
      # carrying four of them — Autoupdate, Updater.app, and two XPC services —
      # which keep whatever signature they shipped with. Notarization rejected the
      # build on exactly those four: no Developer ID, no secure timestamp.
      #
      # Signed inside-out, because signing a container seals what is inside it and
      # re-signing an inner piece afterwards would invalidate the seal.
      - name: Re-sign Sparkle's nested helpers
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          APP="$RUNNER_TEMP/Nook.xcarchive/Products/Applications/Nook.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          IDENTITY="Developer ID Application"

          # Each piece keeps its own entitlements. The XPC services have them for a
          # reason — the downloader is the only part allowed to reach the network —
          # and dropping them would leave an app that notarizes and cannot update.
          resign() {
            local item="$1"
            local ent="$RUNNER_TEMP/ent.plist"
            rm -f "$ent"
            if codesign -d --entitlements - --xml "$item" 2>/dev/null \
                 | plutil -convert xml1 -o "$ent" - 2>/dev/null && [ -s "$ent" ]; then
              codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                --entitlements "$ent" "$item"
              echo "  re-signed with entitlements: ${item#"$APP"/}"
            else
              codesign --force --sign "$IDENTITY" --options runtime --timestamp "$item"
              echo "  re-signed: ${item#"$APP"/}"
            fi
          }

          shopt -s nullglob
          for xpc in "$SPARKLE"/Versions/*/XPCServices/*.xpc; do resign "$xpc"; done
          for helper in "$SPARKLE"/Versions/*/Updater.app "$SPARKLE"/Versions/*/Autoupdate; do
            resign "$helper"
          done
          shopt -u nullglob
          resign "$SPARKLE"
          resign "$APP"

          # --deep is wrong for signing and right for checking: it walks everything
          # nested and is what notarization effectively does.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Nothing may be left over from before. A single ad-hoc signature in there
          # is another rejected submission ten minutes later.
          if codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "the app is still ad-hoc signed"; exit 1
          fi

      - name: Archive app (ad-hoc signed)
        if: steps.signing.outputs.mode == 'ad-hoc'
        run: |
          xcodebuild archive \
            -skipPackagePluginValidation \
            -project Nook.xcodeproj \
            -scheme Nook \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Nook.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="$RUNNER_TEMP/Nook.xcarchive/Products/Applications/Nook.app"
          ICNS="$APP/Contents/Resources/AppIcon.icns"
          SRC="$RUNNER_TEMP/dmg-src"
          DMG="Nook-${VERSION}.dmg"

          # create-dmg reliably sets the mounted-volume icon and lays out the
          # window (icon view, positions, Applications drop link) in CI, which a
          # hand-rolled hdiutil + Finder sequence did not do consistently.
          brew install create-dmg

          rm -rf "$SRC" "$DMG"
          mkdir -p "$SRC"
          cp -R "$APP" "$SRC/"

          # create-dmg can exit non-zero after a successful build (e.g. it
          # can't unmount immediately); guard by checking the file exists.
          create-dmg \
            --volname "Nook ${VERSION}" \
            --volicon "$ICNS" \
            --window-pos 200 120 \
            --window-size 520 360 \
            --icon-size 104 \
            --icon "Nook.app" 140 190 \
            --app-drop-link 380 190 \
            --hide-extension "Nook.app" \
            --no-internet-enable \
            "$DMG" "$SRC" || true

          test -f "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # Notarizing the DMG staples the ticket to the thing people download, so a
      # first launch works without a network round trip to Apple.
      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          DMG="${{ steps.dmg.outputs.path }}"
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$KEY_P8" | base64 --decode > "$KEY"
          # Removed however this step ends. A notary key can submit builds as this
          # developer, so it must not survive on the runner's disk.
          trap 'rm -f "$KEY"' EXIT

          set +e
          OUT="$(xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m 2>&1)"
          SUBMIT_STATUS=$?
          set -e
          printf '%s\n' "$OUT"

          # `--wait` returning 0 does not mean the build was accepted: it means the
          # wait finished. A rejected submission reports "status: Invalid" and used
          # to fall through to stapling, which then failed with an unrelated
          # "Record not found" and buried the actual reason.
          ID="$(printf '%s' "$OUT" | awk '/^  id: /{print $2; exit}')"
          if ! printf '%s' "$OUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did not succeed. Apple's reasons follow."
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" \
                --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER_ID" || true
            fi
            exit 1
          fi
          [ "$SUBMIT_STATUS" -eq 0 ] || exit "$SUBMIT_STATUS"

          xcrun stapler staple "$DMG"
          # Gatekeeper's own answer, not ours. A build that signs and staples but
          # is rejected here would otherwise ship looking fine.
          xcrun stapler validate "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"
          spctl -a -vvv -t install "$MOUNT/Nook.app"
          codesign -dv --verbose=4 "$MOUNT/Nook.app" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "hardened runtime missing"; exit 1; }
          hdiutil detach "$MOUNT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nook-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      # A second copy of the same file under a name that never changes. GitHub's
      # /releases/latest/download/<name> redirect needs a fixed asset name, and
      # the versioned one moves every release, so without this the website can
      # only link to the release page and let people find the file. Copied after
      # notarization, so it carries the stapled ticket rather than a fresh
      # unstapled image.
      - name: Add a version-less copy of the DMG
        id: stable_dmg
        if: github.event_name == 'push'
        run: |
          cp "${{ steps.dmg.outputs.path }}" Nook.dmg
          # Byte-identical or the stable URL would serve a different build than
          # the versioned one, which is the whole thing this must not do.
          shasum -a 256 "${{ steps.dmg.outputs.path }}" Nook.dmg
          cmp "${{ steps.dmg.outputs.path }}" Nook.dmg
          echo "path=Nook.dmg" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.stable_dmg.outputs.path }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download `Nook-${{ steps.version.outputs.version }}.dmg` below.
            2. Open it and drag **Nook** into **Applications**.
            ${{ steps.signing.outputs.mode == 'ad-hoc' && '3. This build is ad-hoc signed, not notarized, so the first launch is blocked: right-click `Nook.app`, choose **Open**, then **Open** again.' || '' }}

            Requires macOS 26 or later.

            `Nook.dmg` is the same file under a name that does not change, so
            <https://github.com/nooker-app/nook/releases/latest/download/Nook.dmg>
            always reaches the current build. That is what the download page links to.

      # --- Homebrew cask: publish/update a cask in the custom tap ---
      # Requires repo secret HOMEBREW_TAP_DEPLOY_KEY: the PRIVATE half of an SSH
      # deploy key added (with write access) to the tap repo
      # nooker-app/homebrew-tap. Users then:
      #   brew install --cask nooker-app/tap/nook
      - name: Publish Homebrew cask
        if: github.event_name == 'push'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          TAP_REPO: nooker-app/homebrew-tap
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY not set — skipping cask publish."
            exit 0
          fi

          # Authenticate to the tap over SSH with its repo-scoped deploy key.
          KEY="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          SHA="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "git@github.com:${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"

          # Build the cask line by line (no reliance on heredoc indentation) so the
          # Ruby interpolation #{version}/#{appdir} stays literal while version/sha
          # are baked in.
          VERSION="$VERSION" SHA="$SHA" OUT="$TAP_DIR/Casks/nook.rb" python3 - <<'PY'
          import os
          ver = os.environ["VERSION"]
          sha = os.environ["SHA"]
          lines = [
              'cask "nook" do',
              f'  version "{ver}"',
              f'  sha256 "{sha}"',
              '',
              '  url "https://github.com/nooker-app/nook/releases/download/v#{version}/Nook-#{version}.dmg"',
              '  name "Nook"',
              '  desc "Native RSS reader that keeps your feeds in a plain folder"',
              '  homepage "https://www.nooker.app/download/"',
              '',
              '  livecheck do',
              '    url :url',
              '    strategy :github_latest',
              '  end',
              '',
              # No caveats: since 0.1.51 the DMG is Developer ID signed, notarized,
              # and stapled, so a cask install opens without the quarantine detour the
              # ad-hoc builds needed. auto_updates is true because Sparkle takes over
              # from there. Both lines are wrong together if signing ever regresses.
              '  auto_updates true',
              # Nook targets macOS 26. Without this, Homebrew installs onto an
              # older macOS and the failure surfaces as an app that will not open.
              # `macos:` compares with >=, so the bare symbol means Tahoe or newer.
              '  depends_on macos: :tahoe',
              '',
              '  app "Nook.app"',
              '',
              '  zap trash: [',
              '    "~/Library/Application Support/Nook",',
              '    "~/Library/Caches/com.tim.nook",',
              '    "~/Library/HTTPStorages/com.tim.nook",',
              '    "~/Library/Preferences/com.tim.nook.plist",',
              '    "~/Library/Saved Application State/com.tim.nook.savedState",',
              '  ]',
              'end',
              '',
          ]
          open(os.environ["OUT"], "w").write("\n".join(lines))
          PY

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nook.rb
          if git commit -m "nook ${VERSION}"; then
            git push
          else
            echo "No cask change."
          fi
          rm -f "$KEY"

      # --- Sparkle auto-update: sign the DMG and publish an appcast ---
      # Requires repo secret SPARKLE_PRIVATE_KEY (from Sparkle's generate_keys)
      # and GitHub Pages served from the gh-pages branch. The app's Info.plist
      # SUFeedURL must point at <owner>.github.io/<repo>/appcast.xml.
      - name: Sign update and build appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY secret not set — skipping appcast."
            echo "skip_appcast=true" >> "$GITHUB_ENV"
            exit 0
          fi

          SPARKLE_VER=2.9.4
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          # sign_update prints: sparkle:edSignature="..." length="..."
          # The private key is passed via a file (-s is removed in Sparkle 2.9+).
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          SIGN_OUT="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle_ed_key" "$DMG_PATH")"
          rm -f "$RUNNER_TEMP/sparkle_ed_key"
          echo "sign_update: $SIGN_OUT"
          ED_SIG="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          ED_LEN="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          FEED_URL="https://raw.githubusercontent.com/${REPO}/gh-pages/appcast.xml"

          mkdir -p public
          # Fetch the existing appcast so release history is preserved.
          curl -fsSL "$FEED_URL" -o public/appcast.xml || echo "No existing appcast; creating a new one."

          BUILD="$BUILD" VERSION="$VERSION" ED_SIG="$ED_SIG" ED_LEN="$ED_LEN" \
          REPO="$REPO" DMG_NAME="$(basename "$DMG_PATH")" PAGES_URL="$FEED_URL" \
          PUBDATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
          python3 - <<'PY'
          import os, re

          build   = os.environ["BUILD"]
          version = os.environ["VERSION"]
          sig     = os.environ["ED_SIG"]
          length  = os.environ["ED_LEN"]
          repo    = os.environ["REPO"]
          dmg     = os.environ["DMG_NAME"]
          pubdate = os.environ["PUBDATE"]
          pages   = os.environ["PAGES_URL"]
          path    = "public/appcast.xml"

          dmg_url   = f"https://github.com/{repo}/releases/download/v{version}/{dmg}"
          notes_url = f"https://github.com/{repo}/releases/tag/v{version}"

          item = (
              "    <item>\n"
              f"      <title>Version {version}</title>\n"
              f"      <sparkle:version>{build}</sparkle:version>\n"
              f"      <sparkle:shortVersionString>{version}</sparkle:shortVersionString>\n"
              "      <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>\n"
              f"      <sparkle:releaseNotesLink>{notes_url}</sparkle:releaseNotesLink>\n"
              f"      <pubDate>{pubdate}</pubDate>\n"
              f'      <enclosure url="{dmg_url}" sparkle:edSignature="{sig}" length="{length}" type="application/octet-stream"/>\n'
              "    </item>\n"
          )

          content = None
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  content = f.read()

          if content and "<item>" in content:
              # Drop any existing item with the same build so re-runs stay idempotent.
              content = re.sub(
                  r"[ \t]*<item>(?:(?!</item>).)*?<sparkle:version>%s</sparkle:version>.*?</item>\n?" % re.escape(build),
                  "", content, flags=re.S,
              )
              idx = content.find("<item>")
              line_start = content.rfind("\n", 0, idx) + 1
              content = content[:line_start] + item + content[line_start:]
          else:
              content = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">\n'
                  "  <channel>\n"
                  "    <title>Nook</title>\n"
                  f"    <link>{pages}</link>\n"
                  "    <description>Nook software updates</description>\n"
                  "    <language>en</language>\n"
                  f"{item}"
                  "  </channel>\n"
                  "</rss>\n"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print(content)
          PY

      - name: Publish appcast to GitHub Pages
        if: github.event_name == 'push' && env.skip_appcast != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
